name: "💡 Feature Request"
description: "Suggest an idea or enhancement for Jellyfin Local Movie Sets"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for your suggestion! Please check existing issues first before submitting a duplicate.

  - type: textarea
    id: problem
    attributes:
      label: "Is your feature request related to a problem?"
      description: "A clear and concise description of what the problem is (e.g., 'I am always frustrated when...')."
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: "Describe the solution you'd like"
      description: "A clear and concise description of what you want to happen."
      placeholder: "e.g., Support reading theme.mp3 from the set folder and setting it as the collection soundtrack..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Describe alternatives you've considered"
      description: "Any alternative solutions or features you've considered."
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: "Additional Context"
      description: "Add any other context, mockup screenshots, or tinyMediaManager settings here."
    validations:
      required: false
